services:
  - type: web
    name: trustmind-api
    runtime: python
    rootDir: backend
    # Repo root must be on PYTHONPATH so `rag/` and `research/` import correctly.
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=/opt/render/project/src uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      # REQUIRED: attach a Render Postgres instance and link its connection string.
      # SQLite on the web service disk is ephemeral — check-in history will be lost.
      - key: DATABASE_URL
        fromDatabase:
          name: trustmind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ANALYSE_BACKEND
        value: auto
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: USE_RAG
        value: "true"
      - key: RAG_TOP_K
        value: "5"
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: ENABLE_ABSTENTION
        value: "true"
      - key: ENABLE_SOURCE_DISPLAY
        value: "true"
      - key: ENABLE_SUPPORT_RESOURCES
        value: "true"
      - key: ENABLE_CONFIDENCE_CALIBRATION
        value: "true"
      - key: CONSISTENCY_RUNS
        value: "3"
      - key: CONSISTENCY_TEMPERATURE
        value: "0.3"
      - key: GROUNDING_RETRIEVAL_QUALITY_MIN
        value: "55"
      - key: GROUNDING_EVIDENCE_STRENGTH_MIN
        value: "50"
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: trustmind-db
    plan: basic-256mb
    databaseName: trustmind
    user: trustmind
